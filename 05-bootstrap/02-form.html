<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->

    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body class="bg-light">
    <main class="d-flex align-items-center">
      <form action="/submit" class="ira-form container mt-5 border border-2 bg-white rounded">
        <div class="row col-12 my-3">
          <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-6 col-col-sm-6 col-form-label" for="balance">Balance ($)</label>
          <div class="col-sm-6">
            <input class="form-control" type="text" id="balance">
          </div>
        </div>
        
        <div class="mb-3 row">
          <label class="col-sm-6 col-col-sm-6 col-form-label" for="annual_contribution">
            Annual Contribution ($)
          </label>
          <div class="col-sm-6">
            <input class="form-control" type="text" id="annual_contribution">
          </div>
        </div>
        
        <fieldset class="mb-3 row">
          <legend class="col-sm-6 col-form-label">
            Maximize Contributions?
          </legend>
          <div class="col-sm-6">
            <div class="form-check">
              <input type="radio" class="form-check-input" name="maximize_contribution" id="yes" />
              <label for="yes" class="form-check-label">Yes</label>
            </div>
            <div class="form-check">
              <input type="radio" class="form-check-input" name="maximize_contribution" id="no" />
              <label for="no" class="form-check-label">No</label>
            </div>
          </div>
        </fieldset>
        
        <div class="mb-3 row">
          <label class="col-sm-6 col-col-sm-6 col-form-label" for="rate_return">
            Expected rate of return (%)
          </label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="rate_return">
          </div>
        </div>
        
        <div class="mb-3 row">
          <label class="col-sm-6 col-col-sm-6 col-form-label" for="current_age">Current Age</label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="current_age">
          </div>
        </div>
        
        <div class="mb-3 row">
          <label class="col-sm-6 col-col-sm-6 col-form-label" for="age_retirement">Retirement Age</label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="age_retirement">
          </div>
        </div>
        
        <div class="mb-3 row">
          <label class="col-sm-6 col-col-sm-6 col-form-label" for="tax_rate">
            Marginal Tax Rate (%)
          </label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="tax_rate">
          </div>
        </div>
        
        <div class="my-4 row">
          <div class="d-flex gap-2">
            <input class="btn btn-primary w-100" type="submit" value="Calculator">
            <input class="btn btn-outline-dark w-100" type="reset" value="Reset">
          </div>
        </div>
        <p>
          This exercise is a simplified version of the Roth IRA Calculator at 
          <a
            class="text-primary"  
            href="https://www.calculator.net/roth-ira-calculator.html"
            >Calculator.net</a>
        </p>
      </form>
    </main>
  </body>
</html>
